name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e .
      - name: Run Pytest
        run: pytest

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check || true
      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
      - name: Run Cargo Tests
        run: cargo test --manifest-path rust/Cargo.toml

  e2e-dogfood-and-install:
    runs-on: ubuntu-latest
    needs: [python-test, rust-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Dogfooding Parity Test
        run: ./tests/test_dogfood.sh
      - name: Smoke test build and install to custom prefix
        run: |
          ./scripts/build.sh prod --install --prefix /tmp/astree-install
          /tmp/astree-install/bin/astree --version
          /tmp/astree-install/bin/astree-py --version
